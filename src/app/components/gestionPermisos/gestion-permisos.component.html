<div class="content-area" [class.sidebar-expanded]="sidebarExpanded">

  <button class="mobile-menu-btn" (click)="toggleSidebarMobile()" [class.sidebar-open]="sidebarVisible">
    <i class="fas" [class.fa-bars]="!sidebarVisible" [class.fa-times]="sidebarVisible"></i>
  </button>

  <app-sidebar [userInfo]="userInfo" [isExpanded]="sidebarVisible" (toggleSidebar)="onSidebarToggle($event)">
  </app-sidebar>

  <!-- HEADER -->
  <header class="header">
    <h1 class="title">Gestión de Permisos</h1>
    <img src="assets/img/LogoFraijanes.png" alt="Logo Fraijanes" class="logo">
  </header>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading-overlay">
    <i class="fas fa-spinner fa-spin"></i>
    <span>Cargando permisos...</span>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="permisos-layout" *ngIf="!loading">

    <!-- PANEL IZQUIERDO: Lista de roles -->
    <div class="roles-panel">
      <div class="panel-header">
        <h3><i class="fas fa-users-cog"></i> Roles</h3>
        <p class="panel-subtitle">Selecciona un rol para editar sus permisos</p>
      </div>

      <div class="nota-superadmin">
        <i class="fas fa-shield-alt"></i>
        <span>Administrador y Sistemas tienen acceso total por defecto y no requieren configuración.</span>
      </div>

      <div class="roles-lista">
        <button
          *ngFor="let rol of roles"
          class="rol-item"
          [class.activo]="rolSeleccionado?.idrol === rol.idrol"
          (click)="seleccionarRol(rol)"
        >
          <div class="rol-item-info">
            <span class="rol-nombre">{{ rol.nombre }}</span>
            <span class="rol-desc">{{ rol.descripcion }}</span>
          </div>
          <span class="rol-count">{{ rol.permisosAsignados.length }}/{{ permisos.length }}</span>
        </button>
      </div>
    </div>

    <!-- PANEL DERECHO: Permisos del rol seleccionado -->
    <div class="permisos-panel" *ngIf="rolSeleccionado">

      <div class="panel-header-right">
        <div>
          <h3>{{ rolSeleccionado.nombre }}</h3>
          <p class="panel-subtitle">Marca las páginas a las que este rol puede acceder</p>
        </div>
        <div class="panel-acciones">
          <button class="btn-toggle-todos" (click)="toggleTodos(!todosSeleccionados)">
            <i class="fas" [class.fa-check-square]="!todosSeleccionados" [class.fa-square]="todosSeleccionados"></i>
            {{ todosSeleccionados ? 'Desmarcar todo' : 'Marcar todo' }}
          </button>
          <button
            class="btn-guardar"
            (click)="guardar()"
            [disabled]="guardando"
          >
            <i class="fas" [class.fa-save]="!guardando" [class.fa-spinner]="guardando" [class.fa-spin]="guardando"></i>
            {{ guardando ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
        </div>
      </div>

      <div class="permisos-grid">
        <label
          *ngFor="let permiso of permisos"
          class="permiso-card"
          [class.activo]="tienePermiso(permiso.idpermiso)"
        >
          <input
            type="checkbox"
            [checked]="tienePermiso(permiso.idpermiso)"
            (change)="togglePermiso(permiso.idpermiso)"
          >
          <div class="permiso-icon">
            <i class="fas" [class]="permiso.icono || 'fa-file'"></i>
          </div>
          <div class="permiso-info">
            <span class="permiso-nombre">{{ permiso.nombre }}</span>
            <span class="permiso-ruta">/{{ permiso.ruta }}</span>
          </div>
          <div class="permiso-check">
            <i class="fas fa-check-circle" *ngIf="tienePermiso(permiso.idpermiso)"></i>
            <i class="fas fa-circle" *ngIf="!tienePermiso(permiso.idpermiso)"></i>
          </div>
        </label>
      </div>

    </div>

    <!-- Placeholder cuando no hay rol seleccionado -->
    <div class="permisos-panel permisos-vacio" *ngIf="!rolSeleccionado">
      <i class="fas fa-hand-pointer"></i>
      <p>Selecciona un rol de la lista</p>
    </div>

  </div>
</div>
