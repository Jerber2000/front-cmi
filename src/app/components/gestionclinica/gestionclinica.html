<!-- gestionclinica.html - ✅ TEMPLATE SIMPLIFICADO -->
<div class="content-area" [class.sidebar-expanded]="sidebarExpanded">
  
  <app-sidebar 
    [userInfo]="userInfo"
    (toggleSidebar)="onSidebarToggle($event)">
  </app-sidebar>
  
  <!-- Header -->
  <div class="contenedor-menu">
    <header class="encabezado">
      <div class="contenido-encabezado">
        <div class="izquierda-encabezado">
          <div class="texto-encabezado">
            <h1 class="titulo">{{ nombreClinica }}</h1>
          </div>
          <img src="assets/img/LogoFraijanes.png" alt="Logo Fraijanes" class="logo">
        </div>
      </div>
    </header>
  </div>

  <!-- Controles de información -->
  <div class="tarjeta-control">
    <div class="controles-busqueda">
      <div class="contenedor-busqueda">
        <div class="informacion-sistema">
          <h2>Panel de Control</h2>
          <p>Bienvenido, {{ userInfo.name }}</p>
        </div>
      </div>
      
      <div class="informacion-encabezado">
        <div class="informacion-fecha">
          Fecha: {{ fechaFormateada }}
        </div>
      </div>
    </div>

    <!-- Estadísticas -->
    <div class="fila-estadisticas" *ngIf="estadisticas.length > 0">
      <div 
        class="tarjeta-estadistica" 
        *ngFor="let stat of estadisticas; trackBy: trackByEstadistica"
        [class]="'stat-' + stat.color"
      >
        <div class="valor-estadistica">
          <i [class]="stat.icono"></i>
          {{ stat.valor }}
        </div>
        <div class="etiqueta-estadistica">{{ stat.label }}</div>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div class="main-container">
    <div class="dashboard-content">
      <div class="dashboard-card">
        
        <!-- Loading -->
        <div class="loading-state" *ngIf="loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Cargando módulos...</p>
        </div>

        <!-- Módulos organizados en filas -->
        <div class="modules-container" *ngIf="!loading && modulosFiltrados.length > 0">
          
          <!-- Iterar sobre filas -->
          <ng-container *ngFor="let fila of filasModulos; let i = index">
            
            <!-- Grid de 4 módulos por fila -->
            <div class="icons-grid">
              <div 
                class="icon-item" 
                *ngFor="let modulo of fila; trackBy: trackByModuloId" 
                (click)="navegarA(modulo)"
                [attr.aria-label]="'Navegar a ' + modulo.nombre"
                role="button"
                tabindex="0"
                (keydown.enter)="navegarA(modulo)"
              >
                <div class="icon-circle" [class]="modulo.color">
                  <i [class]="modulo.icono"></i>
                </div>
                <div class="icon-label">{{ modulo.nombre }}</div>
                <div class="icon-description">
                  {{ modulo.descripcion }}
                </div>
              </div>
            </div>

            <!-- Divisor entre filas (excepto la última) -->
            <div class="divider" *ngIf="i < filasModulos.length - 1"></div>
            
          </ng-container>
        </div>

        <!-- Sin módulos -->
        <div class="empty-state" *ngIf="!loading && modulosFiltrados.length === 0">
          <i class="fas fa-exclamation-circle"></i>
          <h3>No hay módulos disponibles</h3>
          <p>No tienes acceso a ningún módulo. Contacta al administrador.</p>
        </div>

      </div>
    </div>
  </div>

</div>
